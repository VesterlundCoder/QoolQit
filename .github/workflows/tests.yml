name: Tests

on:
  push:
    branches: [main, submission-grade]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install pyyaml python-pptx
        pip install jupyter nbconvert

    - name: Run tests
      run: |
        pytest -v

    - name: Run smoke benchmark (does not update latest.txt)
      run: |
        python -m westquant_qoolqit.run_benchmarks --mode smoke --no-update-latest

    - name: Execute combined notebook (must run top-to-bottom)
      run: |
        jupyter nbconvert --to notebook --execute \
          notebooks/westquant_representation_stack_combined.ipynb \
          --output /tmp/validated_combined.ipynb \
          --ExecutePreprocessor.timeout=600

    - name: Validate submission (explicit flagship_v3)
      run: |
        python -m westquant_qoolqit.validate_submission --experiment flagship_v3
