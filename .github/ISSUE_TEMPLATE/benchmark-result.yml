name: Benchmark result
description: Share benchmark results from your hardware or configuration
title: "[BENCHMARK] "
labels: ["benchmark"]
body:
  - type: input
    id: experiment-id
    attributes:
      label: Experiment ID
      placeholder: "flagship_v3"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "Apple M2 Pro / Intel i7 / ..."
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime (seconds)
      placeholder: "392"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Key metrics
      description: Paste the contents of report_metrics.json or summary
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, QoolQit version, OS
