[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant-qoolqit"
version = "1.1.0"
description = "WestQuant Representation Stack for Pasqal QoolQit: Hamiltonian Representation Explorer + Representation Scheduler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "WestQuant / David Vesterlund"}]
dependencies = [
    "qoolqit>=1.4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
notebook = ["jupyter", "nbformat", "nbconvert"]

[tool.setuptools.packages.find]
where = ["."]
include = ["westquant_qoolqit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
